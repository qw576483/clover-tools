# 打表工具配置示例（复制为 config.yaml 后按需修改）
# 所有相对路径均相对于本配置文件所在目录。

# 策划表目录：扫描其中的 *.xls / *.xlsx（单层扫描，不递归），每个工作表(sheet)即一张表。
# 反向 -pack 模式的源表 *.txt 也平铺在这一层。
# 默认 ../策划 即本仓库的 table/策划/；接入项目时改成自己的策划目录（如 <项目>/策划/数值文档/）。
planning_dir: "../策划"

# 客户端代码格式：固定 cs（C#）。
# 服务器代码恒为 go，不可选；此项只决定客户端产物（当前仅 C#）。
client_format: "cs"

# 服务器（go）输出根目录。代码直接写入此目录（base/ 子包），tsv 写入 tsv/ 子目录。
server_dir: "../产出/服务器"

# 客户端（cs）输出根目录。代码直接写入此目录（Base/ 子目录），tsv 写入 tsv/ 子目录。
client_dir: "../产出/客户端"

# 第 3 行 cs 标记列为空时的默认侧：cs(客户端+服务器) / s(仅服务器) / c(仅客户端)。
default_side: "cs"

# 对照表输出：记录每个产物文件(tsv/代码)来自哪个 xls 的哪个 sheet。
mapping_file: "../产出/对照表.tsv"
